<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPMP Provinsi Lampung</title>

    <!-- Terapkan tema beranda SEBELUM paint pertama agar tidak ada kedipan
         (flash) ke warna default saat refresh. Skrip sinkron ini membaca palet
         yang di-cache useTema dari localStorage lalu menuliskannya ke :root,
         sehingga warna tema sudah aktif sebelum React & API dimuat. Aman untuk
         halaman admin: CSS admin tidak pernah membaca variabel --theme-*. -->
    <script>
      (function () {
        try {
          var v = JSON.parse(localStorage.getItem('beranda-theme-vars'));
          if (v && typeof v === 'object') {
            var r = document.documentElement;
            for (var k in v) {
              if (Object.prototype.hasOwnProperty.call(v, k) && k.indexOf('--theme-') === 0) {
                r.style.setProperty(k, v[k]);
              }
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- defer: skrip Font Awesome tidak lagi menghambat render awal halaman -->
    <script defer src="https://kit.fontawesome.com/0a07513c61.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font Awesome memuat file font dari ka-f.fontawesome.com; preconnect
         mempercepat pembukaan koneksi (LCP lebih cepat di mobile). -->
    <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
    <!-- Poly dibuang (tak dipakai); Poppins dipangkas ke bobot yang benar-benar dipakai (200–800) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
